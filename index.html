<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="data:,">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>街歩きルート再生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root {
  /* 見出し・パネル: 濃紺の面に、白い文字 */
  --pnl: #14213D; --on-pnl: #FFFFFF; --on-pnl-mute: rgba(255, 255, 255, .68);
  --pnl-hair: rgba(255, 255, 255, .16); --pnl-track: rgba(255, 255, 255, .26);
  --route-on-dark: #FF6A5F; --rail-on-dark: #78A8FF; --station-on-dark: #A6C3F4;
  --shadow-p: 0 2px 6px rgba(10, 18, 34, .30), 0 10px 26px rgba(10, 18, 34, .22);
  /* 詳細シート: 明るい面(暗い設定では暗くなる) */
  --sheet: #F8F9FC; --ink: #14213D; --ink-2: #39465E; --mute: #6A768B; --hair: rgba(20, 33, 61, .11);
  --track: #D3D9E3; --on-ink: #FFFFFF; --station-ui: #1F4E8C;
  /* 地図の意味の色 */
  --route: #E8322F; --accent: #E8322F; --rail: #2D6CDF; --station: #1F4E8C;
  --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  --num: "Barlow Semi Condensed", "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  --thumb: 22px;
  --side-w: min(340px, 46vw);
}
@media (prefers-color-scheme: dark) {
  :root {
    --sheet: #111B2E; --ink: #E9EEF8; --ink-2: #C3CCDC; --mute: #94A1B8; --hair: rgba(233, 238, 248, .14);
    --track: #33405A; --on-ink: #0F1A2E; --station-ui: #8DB3EA;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh;
  font-family: var(--ui); color: var(--ink); background: #E6E9EE; overflow: hidden;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible, #seek:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
svg { display: block; }
#map { position: absolute; inset: 0; }
.hidden { display: none !important; }
.maplibregl-ctrl-top-right { margin-top: env(safe-area-inset-top, 0px); margin-right: env(safe-area-inset-right, 0px); }
.maplibregl-ctrl-attrib { font-size: 11px; }

/* ---- 見出し ---- */
#hdr {
  position: absolute; z-index: 5; left: calc(env(safe-area-inset-left, 0px) + 12px); top: calc(env(safe-area-inset-top, 0px) + 12px);
  max-width: calc(100% - 96px - env(safe-area-inset-left, 0px)); padding: 10px 16px; border-radius: 16px;
  background: var(--pnl); color: var(--on-pnl); box-shadow: var(--shadow-p);
}
#title-main { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#title-sub { display: flex; gap: 12px; margin-top: 1px; font-family: var(--num); font-size: 12.5px; font-weight: 500; color: var(--on-pnl-mute); letter-spacing: .02em; white-space: nowrap; }
#title-sub:empty { display: none; }

/* ---- 地図のボタン ---- */
#map-ctl { position: absolute; z-index: 5; right: calc(env(safe-area-inset-right, 0px) + 12px); top: calc(env(safe-area-inset-top, 0px) + 56px); display: flex; flex-direction: column; gap: 10px; }
.mbtn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--pnl); color: #fff; box-shadow: var(--shadow-p); transition: transform .12s, background .15s, color .15s;
  position: relative;
}
.mbtn .tip {
  position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%) translateX(4px);
  padding: 6px 10px; border-radius: 8px; background: var(--pnl); color: #fff;
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
}
.mbtn:hover .tip, .mbtn:focus-visible .tip, .mbtn.show-tip .tip { opacity: 1; transform: translateY(-50%) translateX(0); }
.mbtn:active { transform: scale(.93); }
.mbtn.on { background: #fff; color: var(--pnl); }
.mbtn svg { width: 22px; height: 22px; }
#speed { font-family: var(--num); font-weight: 700; font-size: 16px; letter-spacing: .01em; }

/* ---- 下のパネル(縦向きスマホ) ---- */
#panel {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; min-width: 0;
  padding: 16px calc(env(safe-area-inset-right, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 16px) calc(env(safe-area-inset-left, 0px) + 18px);
  background: var(--pnl); color: var(--on-pnl); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(10, 18, 34, .32);
}
#panel-inner { max-width: 560px; min-width: 0; margin: 0 auto; }
#panel { transition: opacity .2s; }
body.has-sheet #panel { opacity: 0; pointer-events: none; }   /* 詳細を開いている間は、パネルを隠す */

#now { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; text-align: left; cursor: default; }
#now:not(:disabled) { cursor: pointer; }
#now:disabled { color: inherit; }
.badge { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .12); }
.badge svg { width: 22px; height: 22px; }
.badge.k-sight { color: var(--route-on-dark); }
.badge.k-station { color: var(--station-on-dark); }
.badge.k-landmark { color: var(--rail-on-dark); }
.now-text { flex: 1; min-width: 0; }
#now-name { display: block; font-size: 17px; font-weight: 700; line-height: 1.3; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#now-note { display: block; min-height: 19px; font-size: 13px; line-height: 1.45; color: var(--on-pnl-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#now-more { flex: none; display: flex; align-items: center; gap: 1px; font-size: 13px; font-weight: 700; }
#now-more svg { width: 18px; height: 18px; }

/* 距離と時間: 数字を大きく、下に「名前 / 全体」 */
#metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--pnl-hair); }
.metric { min-width: 0; }
.mv { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.mv .num { font-family: var(--num); font-size: 38px; font-weight: 600; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.mv .unit { font-size: 14px; font-weight: 700; }
.ml { display: flex; flex-wrap: wrap; gap: 0 6px; margin-top: 4px; font-size: 12.5px; color: var(--on-pnl-mute); }
.ml .of { font-family: var(--num); font-variant-numeric: tabular-nums; }
#st-cap { margin-top: 10px; font-size: 11.5px; color: var(--on-pnl-mute); }

/* ---- タイムバー: 路線図のように、停車駅(スポット)を丸で並べる ---- */
#ctrl { display: grid; grid-template-columns: 56px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 14px; align-items: center; margin-top: 12px; }
#play {
  grid-row: 1 / span 2; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  background: #fff; color: var(--pnl); box-shadow: 0 2px 8px rgba(0, 0, 0, .35); transition: transform .12s;
}
#play:active { transform: scale(.93); }
#play svg { width: 24px; height: 24px; }
#tl { position: relative; grid-column: 2; grid-row: 1; height: 36px; }
#tl-blocks, #tl-stops { position: absolute; top: 0; bottom: 0; left: calc(var(--thumb) / 2); right: calc(var(--thumb) / 2); }
#tl-stops { z-index: 3; pointer-events: none; }
.blk { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; overflow: hidden; }
.blk.walk { background: var(--pnl-track); }
.blk.train { background: repeating-linear-gradient(90deg, var(--pnl-track) 0 5px, transparent 5px 9px); }
.blk.bus .fill { background: repeating-linear-gradient(90deg, #3fae6a 0 4px, transparent 4px 7px); }
.blk.custom .fill { background: repeating-linear-gradient(90deg, #8891a0 0 8px, transparent 8px 10px, #8891a0 10px 11px, transparent 11px 13px); }
.blk .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
.blk.walk .fill { background: var(--route-on-dark); }
.blk.train .fill { background: repeating-linear-gradient(90deg, var(--rail-on-dark) 0 5px, transparent 5px 9px); }
.stop { position: absolute; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; display: grid; place-items: center; pointer-events: auto; }
.stop i { display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--pnl); border: 2.5px solid rgba(255, 255, 255, .78); transition: background .2s, border-color .2s; }
.stop.kind-station i { border-radius: 4px; border-color: var(--station-on-dark); }
.stop.kind-landmark i { border-color: var(--rail-on-dark); }
.stop.done i { background: var(--route-on-dark); border-color: var(--route-on-dark); }
.stop.kind-station.done i { background: var(--station-on-dark); border-color: var(--station-on-dark); }
.stop.kind-landmark.done i { background: var(--rail-on-dark); border-color: var(--rail-on-dark); }
#seek {
  position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent;
  -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: none;
}
#seek::-webkit-slider-runnable-track { height: 36px; background: transparent; }
#seek::-moz-range-track { height: 36px; background: transparent; }
#seek::-webkit-slider-thumb {
  -webkit-appearance: none; width: var(--thumb); height: var(--thumb); margin-top: 7px; border-radius: 50%;
  background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(255, 255, 255, .24), 0 1px 4px rgba(0, 0, 0, .45);
}
#seek::-moz-range-thumb { width: var(--thumb); height: var(--thumb); border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(255, 255, 255, .24), 0 1px 4px rgba(0, 0, 0, .45); }
#times { grid-column: 2; grid-row: 2; display: flex; justify-content: space-between; margin-top: -2px; padding: 0 2px; font-family: var(--num); font-size: 12.5px; color: var(--on-pnl-mute); font-variant-numeric: tabular-nums; }

/* ---- スポット: 点(パルス) + 折れ線の引き出し線 + 文字(背景なし・白い縁取り) ---- */
.spot { position: relative; width: 0; height: 0; pointer-events: none; --c: var(--accent); }
.spot.kind-station { --c: var(--station); }
.spot.kind-landmark { --c: var(--rail); }
.spot .dot {
  position: absolute; left: -8px; top: -8px; width: 16px; height: 16px;
  opacity: 0; transform: scale(.4); transition: opacity .35s, transform .35s;
}
.spot.on .dot { opacity: 1; transform: none; }
.spot.now .dot { transform: scale(1.25); }
.spot .core {
  position: absolute; inset: 0; border-radius: 50%; background: var(--c);
  border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45); box-sizing: border-box;
}
.spot .pulse {
  position: absolute; inset: 0; border-radius: 50%; background: var(--c); opacity: 0;
  animation: pulse 1.9s ease-out infinite;
}
@keyframes pulse { 0% { transform: scale(.7); opacity: .55; } 100% { transform: scale(2.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .spot .pulse { animation: none; } }
.spot .lead { position: absolute; left: 0; top: 0; overflow: visible; opacity: 0; transition: opacity .35s .1s; }
.spot.on .lead { opacity: 1; }
.spot .lead path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.spot .lead .casing { stroke: #fff; stroke-width: 3.8px; opacity: .9; }
.spot .lead .line { stroke: var(--c); stroke-width: 1.5px; }
.spot .tagwrap { position: absolute; left: 0; top: 0; }
.spot .tag {
  display: flex; align-items: center; gap: 3px; white-space: nowrap;
  font-weight: 700; font-size: 13px; letter-spacing: .02em; color: var(--c);
  text-shadow: -1.5px 0 #fff, 1.5px 0 #fff, 0 -1.5px #fff, 0 1.5px #fff,
               -1.1px -1.1px #fff, 1.1px -1.1px #fff, -1.1px 1.1px #fff, 1.1px 1.1px #fff, 0 0 4px rgba(255, 255, 255, .95);
  opacity: 0; transform: translateY(4px); transition: opacity .35s .1s, transform .35s .1s;
}
.spot.on .tag { opacity: 1; transform: none; }
.spot.now .tag { font-size: 14.5px; }
.spot.kind-station .core { border-radius: 4px; }
.spot.kind-station .pulse { display: none; }
.spot.kind-station .dot { left: -6px; top: -6px; width: 12px; height: 12px; }
.spot.kind-station .tag { font-size: 12px; }
.spot.kind-station.now .tag { font-size: 13px; }
.spot .ico { display: none; font-size: 13px; text-shadow: none; }
.spot.show-icon .ico { display: inline; }
/* 混み合うときは、いま着いたスポット以外の文字と線を隠す(点は残す) */
.spot.crowded:not(.now) .tag, .spot.crowded:not(.now) .lead { opacity: 0 !important; }
/* 名前も点も、タップで詳細が開く。文字だけだと押しにくいので、見えない当たり判定を広げる */
.spot .tag { padding: 7px 9px; margin: -7px -9px; }
.spot .dot::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; }
.spot.on .tag, .spot.on .dot { pointer-events: auto; cursor: pointer; }
.spot.crowded:not(.now) .tag { pointer-events: none; }
.spot .tag:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }

.mover-wrap { z-index: 6; pointer-events: none; }
.mover .head {
  width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-sizing: border-box;
  box-shadow: 0 0 0 2px rgba(232, 50, 47, .35), 0 1px 4px rgba(0, 0, 0, .5);
}
.mover.train { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .45)); }
.mover img { width: 38px; height: auto; display: block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .45)); }



/* ---- 詳細シート ---- */
#scrim { position: absolute; z-index: 14; inset: 0; background: rgba(10, 18, 34, .42); opacity: 0; pointer-events: none; transition: opacity .25s; }
#scrim.open { opacity: 1; pointer-events: auto; }
#sheet {
  position: absolute; z-index: 15; left: 0; right: 0; bottom: 0; max-height: 88%; display: flex; flex-direction: column;
  background: var(--sheet); color: var(--ink); border-radius: 24px 24px 0 0; box-shadow: 0 -12px 40px rgba(10, 18, 34, .35);
  transform: translateY(104%); visibility: hidden;
  transition: transform .34s cubic-bezier(.2, .85, .25, 1), visibility 0s linear .34s;
}
#sheet.open { transform: none; visibility: visible; transition: transform .34s cubic-bezier(.2, .85, .25, 1), visibility 0s; }
#sheet-grab { position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: 30px; display: flex; justify-content: center; padding-top: 9px; touch-action: none; cursor: grab; }
#sheet-grab span { display: block; width: 38px; height: 5px; border-radius: 3px; background: rgba(20, 33, 61, .25); }
#sheet.has-photo #sheet-grab span { background: rgba(255, 255, 255, .85); }
#sheet-close { position: absolute; z-index: 4; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--hair); color: var(--ink); }
#sheet.has-photo #sheet-close { background: rgba(10, 18, 34, .5); color: #fff; }
#sheet-close svg { width: 18px; height: 18px; }
#sheet-scroll { overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
#sheet-hero { position: relative; aspect-ratio: 16 / 10; max-height: 42vh; background: var(--track); border-radius: 24px 24px 0 0; overflow: hidden; }
#sheet:not(.has-photo) #sheet-hero { display: none; }
#sheet-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 18, 34, .38), transparent 38%); }
#sheet-body { padding: 20px 22px 4px; }
#sheet:not(.has-photo) #sheet-body { padding-top: 36px; }
.tagline { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tagline svg { width: 14px; height: 14px; }
.tagline.k-sight { background: rgba(232, 50, 47, .12); color: var(--route); }
.tagline.k-station { background: rgba(31, 78, 140, .13); color: var(--station-ui); }
.tagline.k-landmark { background: rgba(45, 108, 223, .13); color: var(--rail); }
#sheet-title { margin: 10px 0 10px; font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: .01em; }
#sheet-desc { margin: 0; max-width: 34em; font-size: 15px; line-height: 1.9; color: var(--ink-2); white-space: pre-wrap; }
#sheet-desc.empty { color: var(--mute); }
#sheet-credit { margin-top: 12px; font-size: 11.5px; color: var(--mute); }
#sheet-actions { padding: 18px 22px 0; }
.btn-primary { width: 100%; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--ink); color: var(--on-ink); font-size: 15px; font-weight: 700; }
.btn-primary svg { width: 18px; height: 18px; }

#msg {
  position: absolute; z-index: 20; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center; background: var(--pnl); color: var(--on-pnl); font-size: 15px; line-height: 1.8; white-space: pre-wrap;
}

/* ================= 画面サイズごとの配置 ================= */
/* 幅が狭いスマホ(〜359px): 文字と余白を少し小さく */
@media (max-width: 359px) {
  #panel { padding-left: calc(env(safe-area-inset-left, 0px) + 14px); padding-right: calc(env(safe-area-inset-right, 0px) + 14px); }
  .mv .num { font-size: 32px; }
  #now-name { font-size: 16px; }
  #ctrl { grid-template-columns: 50px minmax(0, 1fr); column-gap: 10px; }
  #play { width: 50px; height: 50px; }
  .mbtn { width: 40px; height: 40px; }
  #hdr { max-width: calc(100% - 84px - env(safe-area-inset-left, 0px)); }
}
/* 縦向きで、背が低いスマホ(SEなど): 補足を省いて低くする */
@media (max-height: 680px) and (orientation: portrait) {
  #panel { padding-top: 12px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  #now { min-height: 40px; }
  .badge { width: 36px; height: 36px; }
  #metrics { margin-top: 8px; padding-top: 10px; }
  .mv .num { font-size: 32px; }
  #st-cap { display: none; }
  #ctrl { margin-top: 8px; }
}
/* 横向きのスマホ: パネルを左の列にして、地図を広く使う */
@media (max-height: 500px) and (orientation: landscape) {
  #panel {
    left: 0; top: 0; right: auto; bottom: 0; width: calc(var(--side-w) + env(safe-area-inset-left, 0px));
    border-radius: 0 24px 24px 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 16px);
    box-shadow: 8px 0 30px rgba(10, 18, 34, .32);
  }
  #panel-inner { max-width: none; width: 100%; }
  #hdr { left: calc(var(--side-w) + env(safe-area-inset-left, 0px) + 12px); max-width: calc(100% - var(--side-w) - env(safe-area-inset-left, 0px) - 108px); }
  #st-cap { display: none; }
  .mv .num { font-size: 32px; }
  #now { min-height: 40px; }
  #metrics { margin-top: 8px; padding-top: 10px; }
  #sheet { left: auto; top: 0; right: 0; bottom: 0; width: min(440px, 62vw); max-height: none; padding-right: env(safe-area-inset-right, 0px); border-radius: 24px 0 0 24px; transform: translateX(104%); }
  #sheet.open { transform: none; }
  #sheet-grab { display: none; }
  #sheet-hero { border-radius: 24px 0 0 0; max-height: 36vh; }
  #sheet:not(.has-photo) #sheet-body { padding-top: 56px; }
}
/* タブレット・PC: パネルは、下に浮かぶカードにする */
@media (min-width: 720px) and (min-height: 501px) {
  #panel { left: 50%; right: auto; bottom: 16px; width: min(480px, calc(100% - 32px)); transform: translateX(-50%); border-radius: 24px; padding-bottom: 16px; }
  #sheet { left: 50%; right: auto; width: min(560px, 100%); margin-left: 0; transform: translate(-50%, 104%); }
  #sheet.open { transform: translate(-50%, 0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
<div id="map"></div>

<header id="hdr">

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ============================================================
 * CORE: 描画に依存しない計算(再生時間の設計、位置、距離、ラベルの向きなど)
 * ============================================================ */
/* CORE:BEGIN */
const R_EARTH = 6371008.8;
const RAD = Math.PI / 180;

function clamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
function lerp(a, b, f) { return a + (b - a) * f; }

/** 2点間の距離(m)。狭い範囲なので、緯度で補正した平面近似で十分。a,b = [lon, lat] */
function mDist(a, b) {
  const k = Math.cos((a[1] + b[1]) / 2 * RAD);
  return Math.hypot((b[0] - a[0]) * RAD * k * R_EARTH, (b[1] - a[1]) * RAD * R_EARTH);
}
/** a→b の向き(北=0, 東=90) */
function bearingDeg(a, b) {
  const k = Math.cos((a[1] + b[1]) / 2 * RAD);
  return (Math.atan2((b[0] - a[0]) * k, b[1] - a[1]) / RAD + 360) % 360;
}
/** 角度 a から b への差(-180〜180) */
function angDiff(a, b) { return ((b - a + 540) % 360) - 180; }
function lerpAngle(a, b, f) { return (a + angDiff(a, b) * f + 360) % 360; }
function fmtTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

/** route.geojson を、計算しやすい形にする */
function parseRoute(fc) {
  const legs = [], spots = [];
  for (const f of fc.features || []) {
    const p = f.properties || {};
    const g = f.geometry;
    if (p.kind === "leg" && g && g.type === "LineString" && g.coordinates.length > 1) {
      const coords = g.coordinates, cum = [0];
      for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + mDist(coords[i - 1], coords[i]));
      legs.push({ mode: p.mode || "walk", from: p.from, to: p.to, d0: p.d0, d1: p.d1, coords, cum, len: cum[cum.length - 1] });
    } else if (p.kind === "spot" && g && g.type === "Point") {
      spots.push({ name: p.name, category: p.category || "spot", note: p.note || "", d: p.d,
                   show: p.show !== false, lon: g.coordinates[0], lat: g.coordinates[1],
                   desc: p.desc || "", photo: p.photo || "", credit: p.credit || "", dir: p.dir === undefined ? "" : String(p.dir) });
    }
  }
  legs.sort((a, b) => a.d0 - b.d0);
  spots.sort((a, b) => a.d - b.d);
  return { meta: fc.meta || {}, legs, spots, total: legs.length ? legs[legs.length - 1].d1 : 0 };
}

/**
 * 「時間 → 進んだ距離」の対応表を作る。
 *  ・区間の種類(walk/train)ごとに進む速さ(m/秒)を変える
 *  ・ラベルを出すスポットに着いたら、pause_s 秒だけ止まる
 */
function buildTimeline(route, pb) {
  const speed = { walk: pb.walk_mps, train: pb.train_mps, bus: pb.bus_mps, custom: pb.custom_mps };
  const shown = route.spots.filter(s => s.show).map(s => s.d);
  const raw = [0, route.total, ...shown];
  route.legs.forEach(l => raw.push(l.d0, l.d1));
  raw.sort((a, b) => a - b);
  const pts = [];
  for (const d of raw) if (!pts.length || d - pts[pts.length - 1] > 0.01) pts.push(d);

  const isShown = d => shown.some(s => Math.abs(s - d) < 0.5);
  const modeAt = d => {
    const l = route.legs.find(l => d >= l.d0 && d <= l.d1) || route.legs[route.legs.length - 1];
    return l ? l.mode : "walk";
  };

  const segs = [];
  let t = 0, lastMode = route.legs.length ? route.legs[0].mode : "walk";
  if (isShown(0) && pb.start_pause_s > 0) {
    segs.push({ t0: 0, t1: pb.start_pause_s, d0: 0, d1: 0, mode: "pause", move: lastMode });
    t = pb.start_pause_s;
  }
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const mode = modeAt((a + b) / 2);
    const dur = (b - a) / (speed[mode] || speed.walk);
    segs.push({ t0: t, t1: t + dur, d0: a, d1: b, mode });
    t += dur; lastMode = mode;
    if (isShown(b) && pb.pause_s > 0) {
      segs.push({ t0: t, t1: t + pb.pause_s, d0: b, d1: b, mode: "pause", move: lastMode });
      t += pb.pause_s;
    }
  }
  return { segs, total: t };
}

/** 時刻 t の状態。d=始点からの距離(m) / mode=いまの移動手段 / pausing=停止中か */
function stateAt(tl, t) {
  t = clamp(t, 0, tl.total);
  const segs = tl.segs;
  if (!segs.length) return { d: 0, mode: "walk", pausing: false };
  let lo = 0, hi = segs.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (segs[m].t1 < t) lo = m + 1; else hi = m; }
  const s = segs[lo];
  if (s.mode === "pause") return { d: s.d0, mode: s.move, pausing: true };
  const f = s.t1 > s.t0 ? (t - s.t0) / (s.t1 - s.t0) : 1;
  return { d: s.d0 + (s.d1 - s.d0) * clamp(f, 0, 1), mode: s.mode, pausing: false };
}

/** 距離 d に着く時刻(スポットの到着時刻に使う)。停止区間があれば、その始まり */
function timeAtDistance(tl, d) {
  for (const s of tl.segs) {
    if (s.mode === "pause") { if (Math.abs(s.d0 - d) < 0.5) return s.t0; }
    else if (d >= s.d0 - 1e-6 && d <= s.d1 + 1e-6) return s.t0 + (s.d1 > s.d0 ? (d - s.d0) / (s.d1 - s.d0) : 0) * (s.t1 - s.t0);
  }
  return tl.total;
}

function legAt(route, d) {
  for (const l of route.legs) if (d <= l.d1) return l;
  return route.legs[route.legs.length - 1];
}
/** 区間の中で、割合 f(0〜1)の位置の座標 */
function pointOnLeg(leg, f) {
  const target = clamp(f, 0, 1) * leg.len, c = leg.cum;
  let lo = 0, hi = c.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] <= target) lo = m; else hi = m; }
  const seg = c[hi] - c[lo], u = seg > 0 ? (target - c[lo]) / seg : 0;
  const a = leg.coords[lo], b = leg.coords[hi];
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
}
/** 始点から d メートルの位置の座標 */
function pointAt(route, d) {
  const leg = legAt(route, d), span = leg.d1 - leg.d0;
  return pointOnLeg(leg, span > 0 ? (d - leg.d0) / span : 0);
}
/** 区間の始めから、割合 f の位置までの線 */
function cutLeg(leg, f) {
  if (f >= 1) return leg.coords.slice();
  const target = f * leg.len, c = leg.cum;
  let i = 1;
  while (i < c.length && c[i] < target) i++;
  const out = leg.coords.slice(0, i);
  out.push(pointOnLeg(leg, f));
  return out;
}
/** 始点から d メートルまでの線を、walk と train に分けて返す */
function slicePaths(route, d) {
  const out = { walk: [], train: [], bus: [], custom: [] };
  for (const l of route.legs) {
    if (d <= l.d0) break;
    const span = l.d1 - l.d0, f = span > 0 ? clamp((d - l.d0) / span, 0, 1) : 1;
    const coords = cutLeg(l, f);
    if (coords.length > 1) (out[l.mode] || out.walk).push(coords);
  }
  return out;
}
/** 進行方向。先の look メートルを見る。行き止まりでは手前を見る */
function headingAt(route, d, look) {
  const a = pointAt(route, d), b = pointAt(route, Math.min(route.total, d + look));
  if (mDist(a, b) >= 1) return bearingDeg(a, b);
  const a2 = pointAt(route, Math.max(0, d - look));
  return mDist(a2, a) >= 1 ? bearingDeg(a2, a) : null;
}

/** 始点から d メートルまでの、徒歩と電車それぞれの距離(m) */
function breakdownAt(route, d) {
  const out = {};
  for (const l of route.legs) {
    const a = l.d0, b = Math.min(d, l.d1);
    if (b > a) out[l.mode] = (out[l.mode] || 0) + (b - a);
  }
  return out;
}
/** おおよその所要時間(分)。徒歩は分速80m、電車は分速500m(時速30km・停車込み)を既定とする */
  function estMinutes(bd, est) {
  let min = 0;
  for (const [mode, m] of Object.entries(bd)) min += m / (est[mode + "_m_per_min"] || est.walk_m_per_min);
  return min;
}

const DIRS = { n: 0, ne: 45, e: 90, se: 135, s: 180, sw: 225, w: 270, nw: 315 };

/* ---- ラベルの配置 ----
 * 点から「斜めの線 → 水平の短い線 → 文字」の順に出す。線の向きと長さの候補(CANDS)から、
 * 画面上でルートや他のラベルに被りにくいものを選ぶ。すべて画面のピクセル座標で計算する。 */
const STUB = 16;   // 斜めの線の先の、水平な線の長さ(px)
const CANDS = [];
for (const len of [28, 44, 62, 88, 120]) for (const ang of [30, 55, 80]) for (const vy of [-1, 1]) for (const sx of [1, -1])
  CANDS.push({ sx, vy, len, ang, key: [sx, vy, len, ang].join(",") });

/** 候補 c の、点(0,0)からの相対位置。e1=斜めの線の先、e2=水平な線の先、rect=文字の枠 */
function candGeom(c, w, h) {
  const a = c.ang * RAD;
  const e1 = { x: c.sx * Math.cos(a) * c.len, y: c.vy * Math.sin(a) * c.len };
  const e2 = { x: e1.x + c.sx * STUB, y: e1.y };
  const x0 = c.sx > 0 ? e2.x + 4 : e2.x - 4 - w;
  return { e1, e2, rect: { x0, y0: e2.y - h / 2, x1: x0 + w, y1: e2.y + h / 2 } };
}
/** 画面上の折れ線(複数)を、step ピクセルごとの点にする */
function sampleRoute(polylines, step) {
  const out = [];
  for (const pl of polylines) {
    for (let i = 1; i < pl.length; i++) {
      const a = pl[i - 1], b = pl[i], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (!(len < 5000)) continue;   // 画面の遠くや、計算できない点は無視
      const n = Math.min(800, Math.max(1, Math.ceil(len / step)));
      for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
    }
    if (pl.length) out.push(pl[pl.length - 1]);
  }
  return out;
}
/** dir の指定(n, ne, ... または角度)を、好みの側(sx=左右, vy=上下)にする。0 は指定なし */
function dirPref(dir) {
  const s = String(dir || "").toLowerCase().trim();
  let ang;
  if (s in DIRS) ang = DIRS[s];
  else if (s !== "" && !isNaN(parseFloat(s))) ang = parseFloat(s);
  else return { sx: 0, vy: 0 };
  const ux = Math.sin(ang * RAD), uy = -Math.cos(ang * RAD);
  return { sx: Math.abs(ux) < 0.2 ? 0 : (ux > 0 ? 1 : -1), vy: Math.abs(uy) < 0.2 ? 0 : (uy > 0 ? 1 : -1) };
}
function distPtSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2, 0, 1) : 0;
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}
function inRect(p, r, m) { return p[0] >= r.x0 - m && p[0] <= r.x1 + m && p[1] >= r.y0 - m && p[1] <= r.y1 + m; }
function overlapArea(a, b) {
  const w = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0), h = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
  return w > 0 && h > 0 ? w * h : 0;
}
function outsideAmount(r, s) {
  return Math.max(0, s.x0 - r.x0) + Math.max(0, r.x1 - s.x1) + Math.max(0, s.y0 - r.y0) + Math.max(0, r.y1 - s.y1);
}
function absRect(it, g) { return { x0: it.x + g.rect.x0, y0: it.y + g.rect.y0, x1: it.x + g.rect.x1, y1: it.y + g.rect.y1 }; }
/** 線 a→b の途中の数点が、矩形 r に入るか */
function segTouchesRect(a, b, r, m) {
  for (let t = 0; t <= 1.0001; t += 0.1) if (inRect([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], r, m)) return true;
  return false;
}
/** 候補 c の、他のラベルに関係しない部分の点数(ルートとの関係、画面の端、好み、前回との一致)。1回だけ計算する */
function staticScore(it, c, near, safe) {
  const g = candGeom(c, it.w, it.h), R = absRect(it, g);
  const L = [[it.x, it.y], [it.x + g.e1.x, it.y + g.e1.y], [it.x + g.e2.x, it.y + g.e2.y]];
  const pref = it.pref || { sx: 0, vy: 0 };
  let cost = (c.sx < 0 ? 3 : 0) + (c.vy > 0 ? 4 : 0) + c.len * 0.06 + (c.ang === 80 ? 1 : 0);
  let hit = 0, cross = 0;
  for (const p of near) {
    if (inRect(p, R, 3)) hit++;
    if (Math.min(distPtSeg(p, L[0], L[1]), distPtSeg(p, L[1], L[2])) < 3) cross++;
  }
  cost += hit * 5 + Math.min(cross, 8) * 1.5;                              // 文字の下にルートがある / 線がルートをまたぐ
  if (safe && inRect([it.x, it.y], safe, 0)) cost += outsideAmount(R, safe) * 3;   // 画面の端や、操作パネルの下に出る
  if (pref.sx && pref.sx !== c.sx) cost += 40;
  if (pref.vy && pref.vy !== c.vy) cost += 40;
  if (it.prev === c.key) cost -= 6;                                        // 前回の位置を少し優先(ちらつき防止)
  return { cand: c, cost, R, L };
}
/** 他のラベル(others)との関係の点数。ラベルが置かれるたびに変わるので、そのつど計算する */
function dynamicScore(s, others) {
  let cost = 0;
  for (const o of others) {
    cost += overlapArea(s.R, o.R) / 10;                                    // 他のラベルと重なる
    if (segTouchesRect(s.L[0], s.L[1], o.R, 1) || segTouchesRect(s.L[1], s.L[2], o.R, 1)) cost += 25;      // 線が他のラベルを横切る
    if (segTouchesRect(o.L[0], o.L[1], s.R, 1) || segTouchesRect(o.L[1], o.L[2], s.R, 1)) cost += 25;      // 他の線が、このラベルを横切る
    if (inRect(o.L[0], s.R, 6)) cost += 60;                                // 他のスポットの点を隠す
  }
  return cost;
}
/**
 * 各スポットの、ラベルの置き方を決める。
 *  1. 優先度の順に、よい位置を1つずつ置く
 *  2. 他を固定して、1つずつ置き直す(何回か繰り返す)。順番による偏りが減る
 *  3. それでも困りごとが大きいものは、文字と線を隠す(点は残す)
 *  items: [{id, x, y, w, h, prev(前回の候補のkey), must(必ず表示), pref}]  x,y = 画面上の点の位置
 *  routePts: 画面上のルート(点の列)   safe: 文字を置きたい範囲 {x0,y0,x1,y1}
 *  戻り値: { [id]: { cand, cost, hide } }
 */
function layoutLabels(items, routePts, safe, opt) {
  const hideCost = opt && opt.hideCost !== undefined ? opt.hideCost : 70;
  const passes = opt && opt.passes !== undefined ? opt.passes : 4;
  const stat = new Map(items.map(it => {
    const near = routePts.filter(p => Math.abs(p[0] - it.x) < 300 && Math.abs(p[1] - it.y) < 300);
    return [it, CANDS.map(c => staticScore(it, c, near, safe))];
  }));
  const cur = new Map();
  const others = it => items.filter(o => o !== it && cur.has(o) && !cur.get(o).hide).map(o => cur.get(o));
  const place = it => {
    const oth = others(it);
    let best = null;
    for (const s of stat.get(it)) {
      const cost = s.cost + dynamicScore(s, oth);
      if (!best || cost < best.cost) best = { cand: s.cand, cost, R: s.R, L: s.L };
    }
    const before = cur.has(it) ? cur.get(it).cand.key : null;
    cur.set(it, { ...best, hide: false });
    return before !== best.cand.key;
  };
  for (const it of items) place(it);
  for (let k = 0; k < passes; k++) {
    let changed = false;
    for (const it of items) if (place(it)) changed = true;
    if (!changed) break;
  }
  for (const it of items) { const st = cur.get(it); st.hide = !it.must && st.cost > hideCost; }
  for (const it of items) if (!cur.get(it).hide) place(it);
  const result = {};
  for (const it of items) { const st = cur.get(it); result[it.id] = { cand: st.cand, cost: st.cost, hide: st.hide }; }
  return result;
}

function isImageSpec(s) { return /\.(svg|png|webp|gif|jpe?g)(\?.*)?$/i.test(String(s || "")); }
function resolveUrl(base, u) {
  if (!u) return "";
  return /^(https?:|data:|\/)/i.test(u) ? u : base + u;
}
/** categories の設定(文字列だけ、または {icon, kind})を、{icon, kind} にそろえる */
function catInfo(categories, c) {
  const v = categories[c] !== undefined ? categories[c] : categories.spot;
  if (typeof v === "string" || v === undefined) return { icon: v || "📍", kind: c === "station" ? "station" : "sight" };
  return { icon: v.icon || "📍", kind: v.kind || (c === "station" ? "station" : "sight") };
}
function deepMerge(base, extra) {
  if (!extra || typeof extra !== "object" || Array.isArray(extra)) return base;
  const out = Array.isArray(base) ? base.slice() : { ...base };
  for (const k of Object.keys(extra)) {
    const b = base ? base[k] : undefined, e = extra[k];
    out[k] = (b && typeof b === "object" && !Array.isArray(b) && e && typeof e === "object" && !Array.isArray(e))
      ? deepMerge(b, e) : e;
  }
  return out;
}
/* CORE:END */

/* ============================================================
 * アイコン(線の太さをそろえた、自前のSVG)
 * ============================================================ */
const SVG = (inner, filled) => '<svg viewBox="0 0 24 24" aria-hidden="true"' + (filled
  ? ' fill="currentColor">' : ' fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">') + inner + "</svg>";
const ICON = {
  play: SVG('<path d="M7.5 4.8v14.4a.8.8 0 0 0 1.2.7l11.3-7.2a.8.8 0 0 0 0-1.4L8.7 4.1a.8.8 0 0 0-1.2.7z"/>', true),
  pause: SVG('<rect x="6.2" y="4.6" width="4.2" height="14.8" rx="1.3"/><rect x="13.6" y="4.6" width="4.2" height="14.8" rx="1.3"/>', true),
  replay: SVG('<path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>'),
  locate: SVG('<circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>'),
  fit: SVG('<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>'),
  chev: SVG('<path d="M9 6l6 6-6 6"/>'),
  close: SVG('<path d="M6 6l12 12M18 6L6 18"/>'),
  pin: SVG('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'),
  train: SVG('<rect x="5.5" y="3.5" width="13" height="13" rx="3.2"/><path d="M5.5 11h13M8.5 20.5l1.8-4M15.5 20.5l-1.8-4"/><circle cx="9" cy="13.8" r=".7" fill="currentColor"/><circle cx="15" cy="13.8" r=".7" fill="currentColor"/>')
};

/* ============================================================
 * 設定の初期値(ルートごとの config.json で上書きできる)
 * ============================================================ */
const DEFAULTS = {
  title: "",
  subtitle: null,      // 見出しの下の一行。省略すると、徒歩と電車の距離を出す
  playback: { walk_mps: 55, train_mps: 330, bus_mps: 140, custom_mps: 110, pause_s: 1.4, start_pause_s: 1.0 },
  camera: {
    bearing: 0,          // カメラの向き(0=北が上)。回転すると酔いやすいので、既定は固定
    rotate: "off",       // "slow" にすると、道の向きが大きく変わったときだけ、ゆっくり回る
    lookahead_m: 300,
    walk: { zoom: 17.2, pitch: 60 },
    train: { zoom: 15.8, pitch: 50 },
    overview: { pitch: 30 }
  },
  style: {
    basemap: "ofm_positron", map_labels: false, ghost_route: true, walk_head: true,
    route_layer: "below",     // "below": 建物の下に描く(手前のビルが線を隠す) / "above": 建物の上に描く
    route_xray: 0.3,          // 建物に隠れた部分を、うっすら透かして見せる濃さ(0で無効)
    building_opacity: 0.9     // 建物の不透明度(下げると、隠れた線が見えやすくなる)
  },
  icons: { train: "🚃" ,bus: "🚌" },   // 絵文字、または画像ファイル(例: "icons/train.svg")
  categories: {
    station: { icon: "🚉", kind: "station" },
    ruins: { icon: "🏛️", kind: "sight" },
    park: { icon: "🌳", kind: "sight" },
    landmark: { icon: "📍", kind: "landmark" },   // 駅名以外のランドマーク。スポット(赤)と区別して青で表示
    street: { icon: "🛣️", kind: "sight" },
    spot: { icon: "📍", kind: "sight" }
  },
  labels: { icon: false, hide_cost: 70 },   // icon: true なら、ラベルにも絵文字を付ける("station" なら駅だけ)
  estimate: { walk_m_per_min: 80, train_m_per_min: 500, bus_m_per_min: 250, custom_m_per_min: 200 },
  spot_details: {},          // 例: { "八ツ山橋": { "desc": "説明", "photo": "photos/a.jpg", "credit": "撮影: ..." } }
  credits: ["建物: 国土交通省 Project PLATEAU"],
  credits_extra: []
};

const BASEMAPS = {
  ofm_positron: { style: "https://tiles.openfreemap.org/styles/positron" },   // すっきり(淡い)
  ofm_liberty:  { style: "https://tiles.openfreemap.org/styles/liberty" },    // カラフル
  ofm_bright:   { style: "https://tiles.openfreemap.org/styles/bright" },
  gsi_pale: { tiles: ["https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png"], maxzoom: 18, credit: "地理院タイル" },
  gsi_std:  { tiles: ["https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png"],  maxzoom: 18, credit: "地理院タイル" },
  none: {}
};

/* ============================================================
 * アプリ本体
 * ============================================================ */
(async function main() {
  const $ = id => document.getElementById(id);
  const mk = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  const msg = $("msg");
  const fail = text => { msg.textContent = text; msg.classList.remove("hidden"); console.error(text); };

  try {
    const params = new URLSearchParams(location.search);
    const routeId = params.get("route") || "takanawa";
    if (!/^[A-Za-z0-9_-]+$/.test(routeId)) return fail("route の指定が正しくありません。");
    const base = "routes/" + routeId + "/";

    async function fetchJson(url, optional) {
      let r;
      try { r = await fetch(url); } catch (e) { if (optional) return null; throw new Error(url + " を読み込めません"); }
      if (!r.ok) { if (optional) return null; throw new Error(url + " を読み込めません (" + r.status + ")"); }
      return r.json();
    }

    const [routeFc, cfgUser, bld1] = await Promise.all([
      fetchJson(base + "route.geojson"),
      fetchJson(base + "config.json", true),
      fetchJson(base + "buildings.json", true)
    ]);
    const bld = bld1 || await fetchJson(base + "buildings.geojson", true);
    const cfg = deepMerge(DEFAULTS, cfgUser || {});
    // 見え方の比較用: ?route_layer=above や ?xray=0.5 で、設定ファイルを触らずに試せる
    if (params.get("route_layer")) cfg.style.route_layer = params.get("route_layer");
    if (params.get("xray") !== null && !isNaN(Number(params.get("xray")))) cfg.style.route_xray = Number(params.get("xray"));
    if (params.get("pitch") !== null && !isNaN(Number(params.get("pitch")))) cfg.camera.walk.pitch = Number(params.get("pitch"));
    const route = parseRoute(routeFc);
    if (!route.legs.length) return fail("ルートのデータ(leg)が見つかりません。");
    // route.geojson の meta.speed_m_per_min(取り込み時に指定したcustom等の速度)を、config.json の既定値より優先する
    if (route.meta && route.meta.speed_m_per_min) {
      for (const [mode, mpm] of Object.entries(route.meta.speed_m_per_min)) {
        if (mpm) cfg.estimate[mode + "_m_per_min"] = mpm;
      }
    }
    const tl = buildTimeline(route, cfg.playback);

    const title = cfg.title || route.meta.name || routeId;
    $("title-main").textContent = title;
    document.title = title + " | 街歩きルート再生";

    // ----- 距離と時間の表示 -----
    const MODE_LABEL = { walk: "徒歩", train: "電車", bus: "バス", custom: "その他" };
    const totalBd = breakdownAt(route, route.total);
    if (cfg.subtitle) $("title-sub").textContent = cfg.subtitle;
    else {
      for (const mode of ["walk", "train", "bus", "custom"]) {
        const m = totalBd[mode] || 0;
        if (m <= 0) continue;
        const t = mk("span"); t.textContent = MODE_LABEL[mode] + " " + (m / 1000).toFixed(1) + " km";
        $("title-sub").append(t);
      }
    }
    $("st-walk-total").textContent = ((totalBd.walk || 0) / 1000).toFixed(2) + " km";
    $("st-min-total").textContent = Math.round(estMinutes(totalBd, cfg.estimate)) + " 分";
    const extraKm = ["train", "bus", "custom"]
      .map(mode => ({ mode, m: totalBd[mode] || 0 }))
      .filter(x => x.m > 0)
      .map(x => MODE_LABEL[x.mode] + " " + (x.m / 1000).toFixed(2) + " km");
    $("st-cap").textContent = (extraKm.length ? extraKm.join("・") + " を含み、" : "") + "見学時間は除く";
    $("metrics").title = "徒歩は分速" + cfg.estimate.walk_m_per_min + "m、電車は分速" + cfg.estimate.train_m_per_min + "mで計算";

    // ----- 地図 -----
    const bounds = (() => {
      let w = 180, s = 90, e = -180, n = -90;
      for (const l of route.legs) for (const c of l.coords) { w = Math.min(w, c[0]); e = Math.max(e, c[0]); s = Math.min(s, c[1]); n = Math.max(n, c[1]); }
      return [[w, s], [e, n]];
    })();

    async function loadBasemapStyle() {
      const key = cfg.style.basemap;
      const bm = /^https?:/.test(key) ? { style: key } : BASEMAPS[key];
      const plain = tiles => {
        const st = { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#eceff1" } }] };
        if (tiles) { st.sources.base = { type: "raster", tiles: tiles.tiles, tileSize: 256, maxzoom: tiles.maxzoom }; st.layers.push({ id: "base", type: "raster", source: "base" }); }
        return st;
      };
      if (!bm || (!bm.style && !bm.tiles)) return { style: plain(null), credit: "" };
      if (bm.style) {
        try {
          const st = await fetchJson(bm.style);
          // 文字(地名など)と、既存の建物(3D建物と重なるため)を取り除く
          st.layers = st.layers.filter(l => {
            if (l.type === "symbol" && !cfg.style.map_labels) return false;
            if (l["source-layer"] === "building" || /building/i.test(l.id || "")) return false;
            return true;
          });
          return { style: st, credit: "" };  // 出典は、スタイルが自動で表示する
        } catch (e) {
          console.warn("ベースマップの取得に失敗しました。地理院タイルに切り替えます", e);
          return { style: plain(BASEMAPS.gsi_pale), credit: BASEMAPS.gsi_pale.credit };
        }
      }
      return { style: plain(bm), credit: bm.credit || "" };
    }
    const { style, credit } = await loadBasemapStyle();

    const map = new maplibregl.Map({
      container: "map", style, bounds, fitBoundsOptions: { padding: 40 },
      pitch: 30, maxPitch: 80, attributionControl: false, dragRotate: true
    });
    const credits = [...cfg.credits, credit, ...cfg.credits_extra].filter(Boolean).map(s => String(s).replace(/[<>&]/g, ""));
    map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: credits }), "top-right");
    const attrEl = document.querySelector(".maplibregl-ctrl-attrib");   // 出典は、最初から閉じておく(見出しに重なるため)
    if (attrEl) { attrEl.classList.remove("maplibregl-compact-show"); attrEl.removeAttribute("open"); }
    map.on("error", e => console.warn("map error:", e && e.error ? e.error.message : e));

    await Promise.race([
      new Promise(res => map.once("load", res)),
      new Promise((_, rej) => setTimeout(() => rej(new Error("地図の読み込みがタイムアウトしました。通信を確認してください。")), 20000))
    ]);

    const EMPTY = { type: "FeatureCollection", features: [] };
    if (bld) {
      map.addSource("buildings", { type: "geojson", data: bld });
      map.addLayer({
        id: "buildings", type: "fill-extrusion", source: "buildings",
        paint: {
          "fill-extrusion-height": ["get", "h"],
          "fill-extrusion-base": 0,
          "fill-extrusion-color": ["interpolate", ["linear"], ["get", "h"], 0, "#e2ddd5", 20, "#d6cfc4", 60, "#c0bab1", 150, "#a9a49d"],
          "fill-extrusion-opacity": clamp(Number(cfg.style.building_opacity) || 0.9, 0.2, 1),
          "fill-extrusion-vertical-gradient": true
        }
      });
    }
    const ghostData = { type: "FeatureCollection", features: route.legs.map(l => ({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: l.coords } })) };
    map.addSource("ghost", { type: "geojson", data: ghostData });
    map.addSource("walk-done", { type: "geojson", data: EMPTY });
    map.addSource("train-done", { type: "geojson", data: EMPTY });
    map.addSource("bus-done", { type: "geojson", data: EMPTY });
    map.addSource("custom-done", { type: "geojson", data: EMPTY });
    const W = ["interpolate", ["exponential", 1.5], ["zoom"], 13, 2, 17, 6, 19, 11];
    // ルートの線は、建物の「下」に置く。手前のビルが線を隠し、線が屋根の上に乗って見えることがなくなる
    const before = (cfg.style.route_layer !== "above" && bld) ? "buildings" : undefined;
    const addRoute = layer => map.addLayer(layer, before);
    const walkPaint = { "line-color": "#e8322f", "line-width": W };
    const trainPaint = { "line-color": "#2d6cdf", "line-width": W, "line-dasharray": [1.4, 1.2] };
    const busPaint = { "line-color": "#2f9e5c", "line-width": W, "line-dasharray": [0.8, 0.9] };
    const customPaint = { "line-color": "#8891a0", "line-width": W, "line-dasharray": [2, 1, 0.3, 1] }; 
    if (cfg.style.ghost_route) {
      addRoute({ id: "ghost", type: "line", source: "ghost",
        layout: { "line-join": "round" },
        paint: { "line-color": "#7d8590", "line-opacity": 0.5, "line-width": ["interpolate", ["linear"], ["zoom"], 13, 1, 18, 3], "line-dasharray": [0.4, 2.2] } });
    }
    addRoute({ id: "walk-casing", type: "line", source: "walk-done",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#ffffff", "line-opacity": 0.9, "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 13, 4, 17, 10, 19, 16] } });
    addRoute({ id: "walk-line", type: "line", source: "walk-done",
      layout: { "line-join": "round", "line-cap": "round" }, paint: walkPaint });
    addRoute({ id: "train-line", type: "line", source: "train-done",
      layout: { "line-join": "round", "line-cap": "butt" }, paint: trainPaint });
    addRoute({ id: "bus-line", type: "line", source: "bus-done",
      layout: { "line-join": "round", "line-cap": "butt" }, paint: busPaint });
    addRoute({ id: "custom-line", type: "line", source: "custom-done",
      layout: { "line-join": "round", "line-cap": "butt" }, paint: customPaint });
    // 建物に隠れた部分は、建物の上に薄い線を重ねて、たどれるようにする(透視表示)
    const xray = Number(cfg.style.route_xray) || 0;
    if (before && xray > 0) {
      map.addLayer({ id: "walk-xray", type: "line", source: "walk-done",
        layout: { "line-join": "round", "line-cap": "round" }, paint: { ...walkPaint, "line-opacity": xray } });
      map.addLayer({ id: "train-xray", type: "line", source: "train-done",
        layout: { "line-join": "round", "line-cap": "butt" }, paint: { ...trainPaint, "line-opacity": xray } });
    }

    // ----- 詳細シート -----
    const state = { t: 0, playing: false, scrubbing: false, intro: false, follow: true, resumeAfterSheet: false,
                    speedIdx: 0, lastD: -1, lastMode: null, latest: -1, badgeKind: null };
    const speeds = [1, 2, 4];
    state.speedIdx = Math.max(0, speeds.indexOf(Number(params.get("speed")) || 1));

    const detailOf = sp => {
      const o = (cfg.spot_details && cfg.spot_details[sp.name]) || {};
      return { desc: o.desc || sp.desc || "", photo: o.photo || sp.photo || "", credit: o.credit || sp.credit || "" };
    };
    const sheet = $("sheet"), scrim = $("scrim");
    let sheetSpot = -1;
    function openSheet(i) {
      const sp = route.spots[i], d = detailOf(sp), info = catInfo(cfg.categories, sp.category);
      sheetSpot = i;
      const tag = $("sheet-tag");
      tag.className = "tagline k-" + info.kind;
      tag.innerHTML = info.kind === "station" ? ICON.train : ICON.pin;
      const kindLabel = { station: "駅", landmark: "ランドマーク" }[info.kind] || "観光スポット";
      const tx = mk("span"); tx.textContent = kindLabel; tag.append(tx);
      $("sheet-title").textContent = sp.name;
      const text = d.desc || sp.note || "";
      $("sheet-desc").textContent = text || "このスポットの説明は、まだありません。";
      $("sheet-desc").classList.toggle("empty", !text);
      $("sheet-credit").textContent = d.credit || "";
      const img = $("sheet-photo");
      sheet.classList.toggle("has-photo", !!d.photo);
      if (d.photo) { img.onerror = () => sheet.classList.remove("has-photo"); img.alt = sp.name; img.src = resolveUrl(base, d.photo); }
      else img.removeAttribute("src");
      sheet.classList.add("open"); scrim.classList.add("open"); sheet.setAttribute("aria-hidden", "false");
      document.body.classList.add("has-sheet");
      $("sheet-scroll").scrollTop = 0;
      state.resumeAfterSheet = state.playing;
      if (state.playing) pause();
    }
    function closeSheet() {
      if (!sheet.classList.contains("open")) return;
      sheet.classList.remove("open"); scrim.classList.remove("open"); sheet.setAttribute("aria-hidden", "true");
      document.body.classList.remove("has-sheet");
      if (state.resumeAfterSheet) { state.resumeAfterSheet = false; play(); }
    }
    $("sheet-close").innerHTML = ICON.close;
    $("sheet-play").innerHTML = ICON.play + "<span>ここから再生</span>";
    $("sheet-close").addEventListener("click", closeSheet);
    scrim.addEventListener("click", closeSheet);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
    $("sheet-play").addEventListener("click", () => {
      if (sheetSpot < 0) return;
      const t = timeAtDistance(tl, route.spots[sheetSpot].d);
      state.resumeAfterSheet = false;
      closeSheet();
      state.t = clamp(t, 0, tl.total);
      setFollow(true);
      render(true);
      play();
    });
    // つまみを下に引くと閉じる
    let drag = null;
    const grab = $("sheet-grab");
    grab.addEventListener("pointerdown", e => { drag = { y0: e.clientY, dy: 0 }; sheet.style.transition = "none"; if (grab.setPointerCapture) { try { grab.setPointerCapture(e.pointerId); } catch (_) {} } });
    grab.addEventListener("pointermove", e => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y0); sheet.style.transform = "translateY(" + drag.dy + "px)"; });
    const endDrag = () => {
      if (!drag) return;
      const dy = drag.dy; drag = null;
      sheet.style.transition = ""; sheet.style.transform = "";
      if (dy > 90) closeSheet();
    };
    grab.addEventListener("pointerup", endDrag);
    grab.addEventListener("pointercancel", endDrag);

    // ----- スポット: 点(パルス) + 折れ線の引き出し線 + 文字 -----
    const SVGNS = "http://www.w3.org/2000/svg";
    const mkSvg = (tag, cls) => { const e = document.createElementNS(SVGNS, tag); if (cls) e.setAttribute("class", cls); return e; };
    const DEFAULT_CAND = CANDS.find(c => c.sx === 1 && c.vy === -1 && c.len === 44 && c.ang === 55);

    function applyCand(ref, c, w, h, crowded) {
      const g = candGeom(c, w, h);
      const d = "M0,0 L" + g.e1.x.toFixed(1) + "," + g.e1.y.toFixed(1) + " L" + g.e2.x.toFixed(1) + "," + g.e2.y.toFixed(1);
      ref.casing.setAttribute("d", d);
      ref.line.setAttribute("d", d);
      ref.wrap.style.left = (c.sx > 0 ? g.e2.x + 4 : g.e2.x - 4) + "px";
      ref.wrap.style.top = g.e2.y + "px";
      ref.wrap.style.transform = c.sx > 0 ? "translate(0,-50%)" : "translate(-100%,-50%)";
      ref.el.classList.toggle("crowded", !!crowded);
      ref.key = c.key;
    }

    const spotRefs = route.spots.map((sp, i) => {
      if (!sp.show) return null;
      const info = catInfo(cfg.categories, sp.category);
      const withIcon = cfg.labels.icon === true || (cfg.labels.icon === "station" && info.kind === "station");
      const el = mk("div", "spot kind-" + info.kind + (withIcon ? " show-icon" : ""));
      const svg = mkSvg("svg", "lead");
      svg.setAttribute("width", "1"); svg.setAttribute("height", "1");
      const casing = mkSvg("path", "casing"), line = mkSvg("path", "line");
      svg.append(casing, line);
      const dot = mk("div", "dot");
      dot.append(mk("span", "pulse"), mk("span", "core"));
      const wrap = mk("div", "tagwrap"), tag = mk("div", "tag");
      const ico = mk("span", "ico"); ico.textContent = info.icon;
      const lbl = mk("span"); lbl.textContent = sp.name;
      tag.append(ico, lbl);
      wrap.append(tag);
      el.append(svg, dot, wrap);
      // 名前も点も、タップで詳細を開く(説明が未登録なら、その旨を出す)
      tag.setAttribute("role", "button"); tag.tabIndex = 0; tag.setAttribute("aria-label", sp.name + "の説明を開く");
      tag.addEventListener("click", () => openSheet(i));
      tag.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(i); } });
      dot.addEventListener("click", () => openSheet(i));
      new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([sp.lon, sp.lat]).addTo(map);
      const ref = { i, sp, el, tag, wrap, casing, line, info, key: null };
      applyCand(ref, DEFAULT_CAND, 90, 18, false);
      return ref;
    });
    const spotEls = spotRefs.map(r => r && r.el);

    // ----- 動くアイコン(電車のときだけアイコン。徒歩は小さな点) -----
    const moverWrap = mk("div", "mover-wrap"), moverEl = mk("div", "mover");
    moverWrap.append(moverEl);
    const mover = new maplibregl.Marker({ element: moverWrap, anchor: "center" }).setLngLat(route.legs[0].coords[0]).addTo(map);
    function setMover(mode) {
      moverEl.replaceChildren();
      moverEl.className = "mover";
      moverWrap.style.display = "";
      if (mode === "train" || mode === "bus") {
        const spec = cfg.icons[mode];
        if (isImageSpec(spec)) { const img = mk("img"); img.src = resolveUrl(base, spec); img.alt = ""; moverEl.append(img); }
        else { moverEl.classList.add("train"); moverEl.textContent = spec; }
      } else if (mode === "custom") {
        moverEl.append(mk("div", "head"));   // 「その他」は、徒歩と同じ小さな点にする(お好みで変更可)
      } else if (cfg.style.walk_head) moverEl.append(mk("div", "head"));
        else moverWrap.style.display = "none";
    }

    // ----- 再生 -----
    const cam = { bearing: Number(cfg.camera.bearing) || 0, zoom: cfg.camera.walk.zoom, pitch: cfg.camera.walk.pitch };
    const playBtn = $("play"), seek = $("seek"), followBtn = $("follow"), speedBtn = $("speed"), overviewBtn = $("overview");
    const nowEl = $("now");
    followBtn.insertAdjacentHTML("afterbegin", ICON.locate);
    overviewBtn.insertAdjacentHTML("afterbegin", ICON.fit);
    $("now-more").innerHTML = "<span>詳細</span>" + ICON.chev;
    const setPlayIcon = kind => {
      playBtn.innerHTML = ICON[kind];
      playBtn.setAttribute("aria-label", kind === "pause" ? "一時停止" : kind === "replay" ? "もう一度" : "再生");
    };
    setPlayIcon("play");
    const setBadge = kind => {
      if (state.badgeKind === kind) return;
      state.badgeKind = kind;
      const b = $("now-badge");
      b.className = "badge k-" + kind;
      b.innerHTML = kind === "station" ? ICON.train : ICON.pin;
    };
    // 画面のうち、見出し・パネル・ボタンが隠している幅(横向きのスマホでは、パネルが左の列になる)
    const uiInsets = () => {
      const W = $("map").clientWidth || window.innerWidth, H = $("map").clientHeight || window.innerHeight;
      const pr = $("panel").getBoundingClientRect(), hr = $("hdr").getBoundingClientRect(), cr = $("map-ctl").getBoundingClientRect();
      const side = pr.height > H * 0.7 && pr.width < W * 0.7;
      return { side, W, H, top: Math.round(hr.bottom), bottom: side ? 0 : (pr.height ? Math.round(H - pr.top) : 0),
               left: side ? Math.round(pr.right) : 0, right: cr.width ? Math.round(W - cr.left) : 0 };
    };
    const camPadding = () => { const u = uiInsets(); return { top: 0, left: u.left, right: 0, bottom: u.bottom }; };   // パネルを除いた、見える範囲の中央に現在地を置く

    // ----- タイムバー(路線図のように): 歩く区間は実線、電車は破線、停車駅はスポット -----
    const pct = t => (tl.total > 0 ? t / tl.total * 100 : 0);
    const blocks = [];
    for (const sg of tl.segs) {
      const mode = sg.mode === "pause" ? sg.move : sg.mode, lastB = blocks[blocks.length - 1];
      if (lastB && lastB.mode === mode) lastB.t1 = sg.t1; else blocks.push({ mode, t0: sg.t0, t1: sg.t1 });
    }
    for (const b of blocks) {
      const el = mk("div", "blk " + b.mode);
      el.style.left = pct(b.t0) + "%"; el.style.width = pct(b.t1 - b.t0) + "%";
      b.fill = mk("div", "fill"); el.append(b.fill);
      $("tl-blocks").append(el);
    }
    const stops = [];
    route.spots.forEach((sp, i) => {
      if (!sp.show) return;
      const info = catInfo(cfg.categories, sp.category), t = timeAtDistance(tl, sp.d);
      const btn = mk("button", "stop kind-" + info.kind);
      btn.type = "button"; btn.style.left = pct(t) + "%"; btn.setAttribute("aria-label", sp.name + " へ移動"); btn.append(mk("i"));
      btn.addEventListener("click", () => {
        state.t = t;
        if (!state.playing) setPlayIcon(state.t >= tl.total - 0.01 ? "replay" : "play");
        render(true);
      });
      $("tl-stops").append(btn);
      stops.push({ i, t, el: btn });
    });
    function renderTimeline() {
      for (const b of blocks) b.fill.style.width = clamp((state.t - b.t0) / (b.t1 - b.t0), 0, 1) * 100 + "%";
      for (const st of stops) st.el.classList.toggle("done", st.t <= state.t + 0.001);
    }
    $("t-total").textContent = fmtTime(tl.total);

    const setParts = (id, parts) => {
      const src = map.getSource(id);
      if (!src) return;
      src.setData(parts.length ? { type: "Feature", properties: {}, geometry: { type: "MultiLineString", coordinates: parts } } : EMPTY);
    };

    function render(force, dt) {
      const s = stateAt(tl, state.t);
      const pos = pointAt(route, s.d);

      if (force || Math.abs(s.d - state.lastD) > 0.3) {
        const parts = slicePaths(route, s.d);
        setParts("walk-done", parts.walk);
        setParts("train-done", parts.train);
        setParts("bus-done", parts.bus);
        setParts("custom-done", parts.custom);
        state.lastD = s.d;
      }
      mover.setLngLat(pos);
      if (s.mode !== state.lastMode || force) { setMover(s.mode); state.lastMode = s.mode; }

      let latest = -1;
      route.spots.forEach((sp, i) => { if (sp.show && sp.d <= s.d + 0.01) latest = i; });
      spotEls.forEach((el, i) => { if (el) { el.classList.toggle("on", route.spots[i].d <= s.d + 0.01); el.classList.toggle("now", i === latest); } });
      state.latest = latest;
      if (latest >= 0) {
        const sp = route.spots[latest];
        setBadge(catInfo(cfg.categories, sp.category).kind);
        $("now-name").textContent = sp.name;
        $("now-note").textContent = sp.note;
        $("now-more").classList.remove("hidden");
        nowEl.disabled = false;
      } else {
        setBadge("sight");
        $("now-name").textContent = "スタート前"; $("now-note").textContent = "";
        $("now-more").classList.add("hidden"); nowEl.disabled = true;
      }

      const bd = breakdownAt(route, s.d);
      $("st-walk").textContent = ((bd.walk || 0) / 1000).toFixed(2);
      $("st-min").textContent = String(Math.round(estMinutes(bd, cfg.estimate)));
      seek.value = tl.total > 0 ? Math.round(state.t / tl.total * 1000) : 0;
      $("t-now").textContent = fmtTime(state.t);
      renderTimeline();

      if (state.follow && !state.intro) {
        const target = cfg.camera[s.mode] || cfg.camera.walk;
        const k = rate => force ? 1 : 1 - Math.exp(-rate * (dt || 0.016));
        if (cfg.camera.rotate === "slow") {   // 道の向きが大きく変わったときだけ、ゆっくり回す
          const hd = headingAt(route, s.d, cfg.camera.lookahead_m);
          if (hd !== null) {
            const diff = angDiff(cam.bearing, hd);
            if (force) cam.bearing = hd;
            else if (Math.abs(diff) > 40) cam.bearing = (cam.bearing + Math.sign(diff) * Math.min(Math.abs(diff) - 30, 8 * (dt || 0.016)) + 360) % 360;
          }
        } else cam.bearing = Number(cfg.camera.bearing) || 0;
        cam.zoom = lerp(cam.zoom, target.zoom, k(0.9));
        cam.pitch = lerp(cam.pitch, target.pitch, k(0.9));
        map.jumpTo({ center: pos, bearing: cam.bearing, zoom: cam.zoom, pitch: cam.pitch, padding: camPadding() });
      }
    }

    // ----- ラベルの配置を、拡大・縮小・傾きが変わったときに選び直す -----
    const lay = { zoom: null, pitch: null, bearing: null, queued: false };
    function relayout() {
      lay.zoom = map.getZoom(); lay.pitch = map.getPitch(); lay.bearing = map.getBearing();
      const W = $("map").clientWidth || window.innerWidth, H = $("map").clientHeight || window.innerHeight;
      const polylines = route.legs.map(l => l.coords.map(c => { const p = map.project(c); return [p.x, p.y]; }));
      const routePts = sampleRoute(polylines, 6);
      const u = uiInsets();
      const safe = { x0: u.left + 8, y0: u.top + 10, x1: W - Math.max(u.right, 8) - 4, y1: H - u.bottom - 8 };   // 見出し、右のボタン、パネルを避ける
      const items = [];
      spotRefs.forEach(ref => {
        if (!ref) return;
        const p = map.project([ref.sp.lon, ref.sp.lat]);
        if (p.x < -150 || p.x > W + 150 || p.y < -150 || p.y > H + 150) return;   // 画面の外は、そのまま
        items.push({ id: ref.i, x: p.x, y: p.y, w: Math.max(20, (ref.tag.offsetWidth || 108) - 18), h: Math.max(12, (ref.tag.offsetHeight || 32) - 14),
                     prev: ref.key, must: ref.i === state.latest, pref: dirPref(ref.sp.dir),
                     order: (ref.info.kind === "sight" || ref.info.kind === "landmark" ? 0 : 1) * 1000 + ref.i });
      });
      items.sort((a, b) => a.order - b.order);
      const res = layoutLabels(items, routePts, safe, { hideCost: cfg.labels.hide_cost });
      items.forEach(it => { const r = res[it.id]; applyCand(spotRefs[it.id], r.cand, it.w, it.h, r.hide); });
    }
    function scheduleRelayout(force) {
      if (lay.queued) return;
      if (!force && lay.zoom !== null && Math.abs(map.getZoom() - lay.zoom) < 0.12 &&
          Math.abs(map.getPitch() - lay.pitch) < 2.5 && Math.abs(angDiff(map.getBearing(), lay.bearing)) < 4) return;
      lay.queued = true;
      requestAnimationFrame(() => { lay.queued = false; relayout(); });
    }

    const setFollow = on => { state.follow = on; followBtn.classList.toggle("on", on); followBtn.setAttribute("aria-pressed", String(on)); };
    const showOverview = duration => {
      const u = uiInsets();
      const pad = { top: u.top + 30, bottom: u.bottom + 24, left: u.left + 30, right: u.right + 20 };
      if (typeof map.setPadding === "function") map.setPadding({ top: 0, bottom: 0, left: 0, right: 0 });   // 追従中の余白を戻してから、全体表示にする
      map.fitBounds(bounds, { padding: pad, pitch: cfg.camera.overview.pitch, bearing: 0, duration });
      setTimeout(() => scheduleRelayout(true), duration + 150);   // 動きが止まった後の画面で、ラベルを選び直す
    };

    function play() {
      if (state.t >= tl.total - 0.01) { state.t = 0; render(true); }
      state.playing = true;
      setPlayIcon("pause");
      if (state.follow && state.t < 0.05) {
        // 最初の再生では、全体の眺めからスタート地点へ寄っていく
        const s = stateAt(tl, state.t), hd = headingAt(route, s.d, cfg.camera.lookahead_m);
        cam.bearing = cfg.camera.rotate === "slow" && hd !== null ? hd : (Number(cfg.camera.bearing) || 0);
        cam.zoom = cfg.camera.walk.zoom; cam.pitch = cfg.camera.walk.pitch;
        state.intro = true;
        map.easeTo({ center: pointAt(route, s.d), zoom: cam.zoom, pitch: cam.pitch, bearing: cam.bearing, padding: camPadding(), duration: 1200 });
        setTimeout(() => { state.intro = false; }, 1250);
      }
    }
    function pause() {
      state.playing = false;
      setPlayIcon("play");
    }
    function onFinish() {
      state.playing = false;
      setPlayIcon("replay");
      setFollow(false);
      setTimeout(() => showOverview(1500), 600);
    }

    playBtn.addEventListener("click", () => { state.playing ? pause() : play(); });
    seek.addEventListener("pointerdown", () => { state.scrubbing = true; });
    const endScrub = () => { state.scrubbing = false; };
    seek.addEventListener("pointerup", endScrub);
    seek.addEventListener("change", endScrub);
    seek.addEventListener("input", () => {
      state.t = Number(seek.value) / 1000 * tl.total;
      if (!state.playing) setPlayIcon(state.t >= tl.total - 0.01 ? "replay" : "play");
      render(true);
    });
    followBtn.addEventListener("click", () => { setFollow(!state.follow); if (state.follow) render(true); });
    overviewBtn.addEventListener("click", () => { setFollow(false); showOverview(900); });
    speedBtn.addEventListener("click", () => { state.speedIdx = (state.speedIdx + 1) % speeds.length; $("speed-label").textContent = "×" + speeds[state.speedIdx]; speedBtn.setAttribute("aria-label", "再生速度 ×" + speeds[state.speedIdx]); });
    nowEl.addEventListener("click", () => { if (!nowEl.disabled && state.latest >= 0) openSheet(state.latest); });
    map.on("movestart", e => { if (e.originalEvent) setFollow(false); });  // 自分で地図を動かしたら追従を切る
    map.on("move", () => scheduleRelayout(false));
    map.on("resize", () => scheduleRelayout(true));
    window.addEventListener("resize", () => scheduleRelayout(true));
    $("speed-label").textContent = "×" + speeds[state.speedIdx];

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      if (state.playing && !state.scrubbing && !state.intro) {
        state.t = Math.min(tl.total, state.t + dt * speeds[state.speedIdx]);
        const done = state.t >= tl.total;
        render(false, dt);
        if (done) onFinish();
      }
      requestAnimationFrame(frame);
    }

    showOverview(0);
    render(true);
    scheduleRelayout(true);
    setTimeout(() => scheduleRelayout(true), 400);
    msg.classList.add("hidden");
    requestAnimationFrame(frame);
    window.__viewer = { state, tl, route, cfg, map, render, play, pause, openSheet, closeSheet, relayout, spotRefs, stops, blocks };
    if (params.get("autoplay") === "1") setTimeout(play, 600);
    if (!bld) console.warn("建物データ(buildings.json)が見つからないため、3D建物は表示されません。");
  } catch (e) {
    fail("読み込みに失敗しました。\n" + (e && e.message ? e.message : e));
  }

  document.querySelectorAll('#map-ctl .mbtn').forEach(btn => {
  let timer;
  btn.addEventListener('pointerdown', () => {
    btn.classList.add('show-tip');
    clearTimeout(timer);
    timer = setTimeout(() => btn.classList.remove('show-tip'), 900);
  });
});
})();
</script>
</body>
</html>
